<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Metadata, OpenGraph and Schema.org -->
  {% include metadata.html %}

  <!-- Favicon -->
  {% include_cached favicons.html %}

  <!-- Resource hints: preconnect for stylesheets in the critical path,
       dns-prefetch for things loaded later in the body (jQuery, GA). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="dns-prefetch" href="https://ajax.googleapis.com">
  <link rel="dns-prefetch" href="https://www.googletagmanager.com">

  <!-- Fonts (render-blocking — text rendering is critical) -->
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;700;900&display=swap" as="style">
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;700;900&display=swap" rel="stylesheet">

  <!-- Ionicons (deferred — only used for icon glyphs in the social row / footer;
       acceptable brief FOUT on icons, large win on FCP because this is a
       cross-origin render-blocking stylesheet on every page). -->
  <link rel="stylesheet" href="https://unpkg.com/ionicons@4.2.2/dist/css/ionicons.min.css" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://unpkg.com/ionicons@4.2.2/dist/css/ionicons.min.css"></noscript>

  <!-- Theme -->
  <script>
    {% if site.color_scheme == "auto" %}
    if (localStorage.getItem("theme") === "dark" || !localStorage.getItem("theme")){
      document.documentElement.setAttribute("dark", "");
      document.documentElement.classList.add('dark-mode');
    } else if (localStorage.getItem("theme") === "light") {
      document.documentElement.setAttribute("light", "");
      document.documentElement.classList.add('light-mode');
    }
    {% elsif site.color_scheme == "light" %}
      document.documentElement.setAttribute("light", "");
      document.documentElement.classList.add('light-mode');
    {% elsif site.color_scheme == "dark" %}
      document.documentElement.setAttribute("dark", "");
      document.documentElement.classList.add('dark-mode');
    {% else %}
    if (localStorage.getItem("theme") === "dark") {
      document.documentElement.setAttribute("dark", "");
      document.documentElement.classList.add('dark-mode');
    }
    {% endif %}
  </script>

  <!-- SCSS -->
  <style>
    {% capture include_to_scssify %}
      {% include main.scss %}
    {% endcapture %}
    {{ include_to_scssify | scssify }}
  </style>
</head>
